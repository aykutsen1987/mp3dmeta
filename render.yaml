services:
  - type: web
    name: mp3-stream-api
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: YOUTUBE_API_KEY
        sync: false
      - key: COLAB_BACKEND_URL
        sync: false
      - key: YOUTUBE_COOKIES
        sync: false
